<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light; --ink: #172033; --muted: #667085; --line: #e4e7ec; --paper: #fff; --note: #f8fafc; --accent: #3157d5; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #f3f5f8; font: 17px/1.75 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(920px, calc(100% - 32px)); margin: 32px auto; padding: clamp(24px, 5vw, 64px); background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 18px 50px rgba(16, 24, 40, .08); }
    h1, h2, h3 { line-height: 1.25; letter-spacing: -.02em; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); }
    h2 { margin-top: 2.4em; border-bottom: 1px solid var(--line); padding-bottom: .35em; }
    a { color: var(--accent); }
    blockquote { margin: 1.4em 0; padding: .8em 1.2em; border-left: 4px solid var(--accent); background: #f6f8ff; }
    .meta { color: var(--muted); }
    .timestamp { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .assessment { margin: 1.5em 0; padding: 1rem 1.2rem; color: #344054; background: var(--note); border: 1px solid var(--line); border-radius: 12px; font-size: .94rem; }
    .assessment::before { content: "独立观点研判 · 不代表视频作者观点"; display: block; margin-bottom: .5rem; color: var(--muted); font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { padding: .7rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    @media (max-width: 640px) { body { font-size: 16px; } main { width: 100%; margin: 0; border: 0; border-radius: 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="meta">{{REPORT_META}}</p>
      <h1>{{TITLE}}</h1>
      <p>{{SUMMARY}}</p>
    </header>
    {{REPORT_BODY}}
  </main>
</body>
</html>
