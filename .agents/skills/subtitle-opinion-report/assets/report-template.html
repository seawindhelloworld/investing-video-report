<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: dark; --ink: #f4f6fb; --muted: #9da8b9; --line: #293348; --canvas: #070a10; --panel: #121a28; --accent: #f4c65d; --blue: #66c7ff; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font: 17px/1.72 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    main { width: min(1180px, calc(100% - 48px)); margin: 24px auto 72px; }
    .report-cover { min-height: 560px; display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(34px, 7vw, 88px); border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(135deg, #172236, #090d15 62%); }
    .cover-topline, .cover-bottomline { display: flex; justify-content: space-between; gap: 1rem; color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .meta { color: var(--muted); }
    h1 { max-width: 14em; margin: 0; font-size: clamp(2.7rem, 7vw, 5.8rem); line-height: 1.18; letter-spacing: -.035em; }
    .cover-deck { max-width: 50rem; color: #cbd3df; font-size: 1.2rem; }
    .cover-bottomline { justify-content: flex-start; padding-top: 1rem; border-top: 1px solid var(--line); }
    .report-body { padding: 0 clamp(4px, 4vw, 44px); }
    a { color: var(--blue); }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { padding: .8rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    blockquote { margin: 1.4em 0; padding: 1em 1.2em; border-left: 3px solid var(--accent); background: rgba(244, 198, 93, .1); }
    @media (max-width: 780px) { main { width: 100%; margin: 0; } .report-cover { min-height: 620px; border-radius: 0; } .report-body { padding: 0 18px; } }
    @page { size: A4; margin: 14mm 13mm 16mm; }
  </style>
</head>
<body>
  <main>
    <header class="report-cover">
      <div class="cover-topline"><span>Market Intelligence</span><span>Deep Research Report</span></div>
      <p class="meta">{{REPORT_META}}</p>
      <h1>{{TITLE}}</h1>
      <p class="cover-deck">{{SUMMARY}}</p>
      <div class="cover-bottomline"><span>Content</span><span>Evidence</span><span>Decision</span></div>
    </header>
    <div class="report-body">{{REPORT_BODY}}</div>
  </main>
</body>
</html>
