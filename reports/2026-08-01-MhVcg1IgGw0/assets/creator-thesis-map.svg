<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">视频内容的五个主题与共同风险线</title>
  <desc id="desc">半导体仓位、加密立法、AI基金杠杆、达利欧大周期和家庭韧性五个主题，最终共同指向不要把方向判断替代流动性与生存能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef6f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172447" flood-opacity=".10"/></filter>
    <style>
      .eyebrow{font:700 18px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#667085}.headline{font:800 34px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172447}.card-title{font:800 23px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#1f3a8a}.card-copy{font:500 17px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#475467}.bottom{font:800 25px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#6f3b00}.small{font:500 16px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#8a5a20}
    </style>
  </defs>
  <rect width="1200" height="560" rx="26" fill="url(#bg)"/>
  <text x="56" y="54" class="eyebrow">视频所述 · 主题关系图（不按时长或顺序计权）</text>
  <text x="56" y="96" class="headline">五个故事，共同检验“能否活到逻辑兑现”</text>
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="205" height="210" rx="18" fill="#fff" stroke="#cdd6f7"/>
    <rect x="278" y="135" width="205" height="210" rx="18" fill="#fff" stroke="#cdd6f7"/>
    <rect x="501" y="135" width="205" height="210" rx="18" fill="#fff" stroke="#e7b85e"/>
    <rect x="724" y="135" width="205" height="210" rx="18" fill="#fff" stroke="#cdd6f7"/>
    <rect x="947" y="135" width="205" height="210" rx="18" fill="#fff" stroke="#cdd6f7"/>
  </g>
  <g text-anchor="middle">
    <text x="157" y="178" class="card-title">半导体仓位</text><text x="157" y="219" class="card-copy"><tspan x="157">去杠杆可能接近尾声</tspan><tspan x="157" dy="29">不等于估值便宜</tspan><tspan x="157" dy="29">长端利率仍是条件</tspan></text>
    <text x="380" y="178" class="card-title">加密立法</text><text x="380" y="219" class="card-copy"><tspan x="380">催化剂延期</tspan><tspan x="380" dy="29">与“已计价”判断对立</tspan><tspan x="380" dy="29">等待规则落地</tspan></text>
    <text x="603" y="178" class="card-title">AI基金杠杆</text><text x="603" y="219" class="card-copy"><tspan x="603">方向可能正确</tspan><tspan x="603" dy="29">保证金却先到期</tspan><tspan x="603" dy="29">融资约束迫使退出</tspan></text>
    <text x="826" y="178" class="card-title">泡沫与周期</text><text x="826" y="219" class="card-copy"><tspan x="826">真实技术可处于泡沫</tspan><tspan x="826" dy="29">识别过热不等于择时</tspan><tspan x="826" dy="29">触发器决定反转</tspan></text>
    <text x="1049" y="178" class="card-title">家庭韧性</text><text x="1049" y="219" class="card-copy"><tspan x="1049">先做收入中断测试</tspan><tspan x="1049" dy="29">现金缓冲与分散</tspan><tspan x="1049" dy="29">避免不可承受杠杆</tspan></text>
  </g>
  <path d="M157 345v42M380 345v42M603 345v42M826 345v42M1049 345v42" stroke="#8291ad" stroke-width="3"/>
  <path d="M157 387H1049" stroke="#8291ad" stroke-width="3"/>
  <path d="M603 387v38" stroke="#8291ad" stroke-width="3"/>
  <rect x="230" y="425" width="740" height="92" rx="18" fill="#fff4d8" stroke="#e7b85e"/>
  <text x="600" y="465" text-anchor="middle" class="bottom">共同底线：不要让流动性、融资或收入中断替你做最终决定</text>
  <text x="600" y="496" text-anchor="middle" class="small">方向判断、价格判断与生存能力必须分开</text>
</svg>
