      <g transform="translate(970 170)"><rect width="100" height="70" rx="14" fill="#b07b16"/><text x="50" y="44" fill="#fff">1</text></g>

      <g transform="translate(410 270)"><rect width="100" height="70" rx="14" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="50" y="44" fill="#98a2b3">0</text></g>
      <g transform="translate(550 270)"><rect width="100" height="70" rx="14" fill="#4f6fd8"/><text x="50" y="44" fill="#fff">1</text></g>
      <g transform="translate(690 270)"><rect width="100" height="70" rx="14" fill="#d97737"/><text x="50" y="44" fill="#fff">1</text></g>
      <g transform="translate(830 270)"><rect width="100" height="70" rx="14" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="50" y="44" fill="#98a2b3">0</text></g>
      <g transform="translate(970 270)"><rect width="100" height="70" rx="14" fill="#b07b16"/><text x="50" y="44" fill="#fff">1</text></g>

      <g transform="translate(410 370)"><rect width="100" height="70" rx="14" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="50" y="44" fill="#98a2b3">0</text></g>
      <g transform="translate(550 370)"><rect width="100" height="70" rx="14" fill="#4f6fd8"/><text x="50" y="44" fill="#fff">1</text></g>
      <g transform="translate(690 370)"><rect width="100" height="70" rx="14" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="50" y="44" fill="#98a2b3">0</text></g>
      <g transform="translate(830 370)"><rect width="100" height="70" rx="14" fill="#8a8f98"/><text x="50" y="44" fill="#fff">1</text></g>
