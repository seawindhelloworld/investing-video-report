      <g transform="translate(550 470)"><rect width="100" height="70" rx="14" fill="#4f6fd8"/><text x="50" y="44" fill="#fff">2</text></g>
      <g transform="translate(690 470)"><rect width="100" height="70" rx="14" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="50" y="44" fill="#98a2b3">0</text></g>
      <g transform="translate(830 470)"><rect width="100" height="70" rx="14" fill="#fff" stroke="#d0d5dd" stroke-width="2"/><text x="50" y="44" fill="#98a2b3">0</text></g>
      <g transform="translate(970 470)"><rect width="100" height="70" rx="14" fill="#b07b16"/><text x="50" y="44" fill="#fff">1</text></g>
    </g>
  </g>
</svg>
