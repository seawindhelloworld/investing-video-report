<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="market-title market-desc">
  <title id="market-title">视频所述市场脉冲</title>
  <desc id="market-desc">微软上涨超过15%，费城半导体指数反弹8%，纳斯达克100上涨3.2%；Meta下跌约9%，苹果盘后最大跌幅约10%。十年期与三十年期美债收益率仍处高位，因此作者把行情理解为财报修复而非利率压力解除。</desc>
  <rect width="1200" height="590" rx="24" fill="#ffffff"/>
  <text x="60" y="58" fill="#16213e" font-size="30" font-weight="700" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">市场脉冲：AI交易回暖，但债市没有配合</text>
  <text x="60" y="92" fill="#667085" font-size="17" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">以下涨跌幅均为视频口播值；左侧为下跌，右侧为上涨</text>
  <g transform="translate(60 132)" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <line x1="540" y1="0" x2="540" y2="260" stroke="#98a2b3" stroke-width="2"/>
    <text x="540" y="-10" text-anchor="middle" fill="#667085" font-size="14">0%</text>
    <g font-size="17" font-weight="650">
      <text x="0" y="35" fill="#344054">微软</text><rect x="540" y="12" width="390" height="34" rx="8" fill="#2f7d5c"/><text x="944" y="35" fill="#245e47">+15%</text>
      <text x="0" y="87" fill="#344054">SOX</text><rect x="540" y="64" width="208" height="34" rx="8" fill="#4b91c9"/><text x="762" y="87" fill="#315d80">+8%</text>
      <text x="0" y="139" fill="#344054">纳指100</text><rect x="540" y="116" width="83" height="34" rx="8" fill="#7ca8d5"/><text x="637" y="139" fill="#315d80">+3.2%</text>
      <text x="0" y="191" fill="#344054">Meta</text><rect x="306" y="168" width="234" height="34" rx="8" fill="#d88175"/><text x="292" y="191" text-anchor="end" fill="#9b3f36">−9%</text>
      <text x="0" y="243" fill="#344054">苹果盘后最大跌幅</text><rect x="280" y="220" width="260" height="34" rx="8" fill="#c95e59"/><text x="266" y="243" text-anchor="end" fill="#9b3f36">−10%</text>
    </g>
  </g>
  <g transform="translate(60 430)" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="230" height="92" rx="16" fill="#fff6e8"/>
    <text x="20" y="34" fill="#8b5314" font-size="16">10年期美债收益率</text><text x="20" y="70" fill="#5f390f" font-size="28" font-weight="700">4.67%</text>
    <rect x="250" width="230" height="92" rx="16" fill="#fff6e8"/>
    <text x="270" y="34" fill="#8b5314" font-size="16">30年期美债收益率</text><text x="270" y="70" fill="#5f390f" font-size="28" font-weight="700">5.215%</text>
    <rect x="500" width="580" height="92" rx="16" fill="#eef3ff"/>
    <text x="525" y="34" fill="#3157d5" font-size="17" font-weight="700">作者的解释</text>
    <text x="525" y="66" fill="#344054" font-size="17">微软财报暂时盖过利率压力，更像修复，尚非趋势反转。</text>
  </g>
</svg>
