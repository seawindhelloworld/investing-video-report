<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="apple-title apple-desc">
  <title id="apple-title">苹果短期压力与长期框架</title>
  <desc id="apple-desc">视频把苹果分为短期财务压力、AI与产品支撑、作者的投资行动三层。收入增速从本季度16%降至下季度约10%中位数，毛利率指引中位数47.5%，存储涨价和供给约束形成压力；端侧AI、生态与现金流构成长线依据；作者短期认为估值承压，长期维持五到十年框架并小幅补仓。</desc>
  <rect width="1200" height="650" rx="24" fill="#ffffff"/>
  <text x="60" y="58" fill="#16213e" font-size="30" font-weight="700" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">苹果：短期压力与长期框架要分开看</text>
  <text x="60" y="92" fill="#667085" font-size="17" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">从电话会信号，到估值判断，再到作者行动</text>
  <g transform="translate(60 132)" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="330" height="390" rx="18" fill="#fff4ed"/>
    <text x="24" y="42" fill="#a34819" font-size="21" font-weight="700">短期压力</text>
    <text x="24" y="88" fill="#7a3a1b" font-size="16">收入增速</text><text x="24" y="125" fill="#482315" font-size="27" font-weight="700">16% → 约10%</text>
    <text x="24" y="160" fill="#7a3a1b" font-size="16">毛利率指引中位数</text><text x="24" y="197" fill="#482315" font-size="27" font-weight="700">47.5%</text>
    <line x1="24" y1="222" x2="306" y2="222" stroke="#e7baa5"/>
    <text x="24" y="258" fill="#344054" font-size="16">• 存储价格继续上涨</text>
    <text x="24" y="291" fill="#344054" font-size="16">• 先进制程产能不足</text>
    <text x="24" y="324" fill="#344054" font-size="16">• 汇率逆风</text>
    <text x="24" y="357" fill="#344054" font-size="16">• 防御溢价可能回落</text>

    <rect x="375" width="330" height="390" rx="18" fill="#eef7ff"/>
    <text x="399" y="42" fill="#2c6290" font-size="21" font-weight="700">经营与AI支撑</text>
    <text x="399" y="88" fill="#344054" font-size="16">• iPhone、Mac需求强于预估</text>
    <text x="399" y="125" fill="#344054" font-size="16">• 端侧运行被视为竞争优势</text>
    <text x="399" y="162" fill="#344054" font-size="16">• Mac定位本地AI与Agent平台</text>
    <text x="399" y="199" fill="#344054" font-size="16">• iCloud+或承担高频云端成本</text>
    <line x1="399" y1="224" x2="681" y2="224" stroke="#b9d7ed"/>
    <text x="399" y="264" fill="#2c6290" font-size="16" font-weight="700">仍未解决</text>
    <text x="399" y="301" fill="#344054" font-size="16">成本与AI变现如何平衡</text>
    <text x="399" y="338" fill="#344054" font-size="16">涨价对销量弹性影响如何</text>

    <rect x="750" width="330" height="390" rx="18" fill="#eef8f2"/>
    <text x="774" y="42" fill="#237653" font-size="21" font-weight="700">作者的判断与行动</text>
    <text x="774" y="89" fill="#237653" font-size="16" font-weight="700">短期</text>
    <text x="774" y="124" fill="#344054" font-size="16">35倍前瞻PE较难维持；</text>
    <text x="774" y="154" fill="#344054" font-size="16">恐高者可管理仓位。</text>
    <text x="774" y="205" fill="#237653" font-size="16" font-weight="700">长期</text>
    <text x="774" y="240" fill="#344054" font-size="16">维持5–10年投资框架；</text>
    <text x="774" y="270" fill="#344054" font-size="16">现金流、生态与边缘AI未变。</text>
    <text x="774" y="321" fill="#237653" font-size="16" font-weight="700">行动</text>
    <text x="774" y="356" fill="#344054" font-size="16">盘后小幅补仓，原仓位较重。</text>
  </g>
  <text x="60" y="578" fill="#667085" font-size="15" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">注：图中数字与判断均按视频所述整理，不代表已完成全面事实核查，也不构成投资建议。</text>
</svg>
