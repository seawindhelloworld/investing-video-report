<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f6fb;
      --muted: #9da8b9;
      --line: #293348;
      --paper: #0d131e;
      --canvas: #070a10;
      --panel: #121a28;
      --panel-strong: #172235;
      --accent: #f4c65d;
      --accent-soft: rgba(244, 198, 93, .12);
      --blue: #66c7ff;
      --blue-soft: rgba(102, 199, 255, .11);
      --positive: #64d899;
      --positive-soft: rgba(100, 216, 153, .11);
      --negative: #ff8178;
      --negative-soft: rgba(255, 129, 120, .11);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--canvas); }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(49, 94, 154, .18), transparent 32rem),
        radial-gradient(circle at 90% 18%, rgba(244, 198, 93, .08), transparent 28rem),
        var(--canvas);
      font: 17px/1.72 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
    }
    main { width: min(1180px, calc(100% - 48px)); margin: 24px auto 72px; }
    .report-cover {
      position: relative;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: clamp(34px, 7vw, 88px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(22, 34, 54, .98), rgba(9, 13, 21, .96) 62%);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .36);
      isolation: isolate;
    }
    .report-cover::before {
      content: "";
      position: absolute;
      width: 30rem;
      height: 30rem;
      top: -15rem;
      right: -6rem;
      border: 1px solid rgba(244, 198, 93, .28);
      border-radius: 50%;
      box-shadow: 0 0 0 5rem rgba(244, 198, 93, .025), 0 0 0 10rem rgba(102, 199, 255, .018);
      z-index: -1;
    }
    .cover-topline, .cover-bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .cover-topline { position: absolute; top: clamp(28px, 5vw, 54px); left: clamp(34px, 7vw, 88px); right: clamp(34px, 7vw, 88px); }
    .cover-topline span:last-child { color: var(--muted); }
    .meta { margin: 0 0 1.2rem; color: var(--muted); font-size: .82rem; letter-spacing: .06em; }
    h1, h2, h3, h4 { line-height: 1.18; letter-spacing: -.035em; text-wrap: balance; }
    h1 { max-width: 14em; margin: 0; font-size: clamp(2.7rem, 7vw, 5.8rem); font-weight: 820; }
    .cover-deck { max-width: 50rem; margin: 1.4rem 0 2.1rem; color: #cbd3df; font-size: clamp(1.05rem, 2.1vw, 1.35rem); line-height: 1.58; }
    .cover-bottomline { justify-content: flex-start; flex-wrap: wrap; padding-top: 1.25rem; border-top: 1px solid var(--line); color: var(--muted); }
    .cover-bottomline span { display: inline-flex; align-items: center; gap: .55rem; }
    .cover-bottomline span::before { content: ""; width: .38rem; height: .38rem; border-radius: 50%; background: var(--accent); }
    .report-body { padding: 0 clamp(4px, 4vw, 44px); }
    .reading-paths {
      position: sticky;
      top: .65rem;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem;
      margin: 1rem 0 2.6rem;
      padding: .7rem .8rem;
      border: 1px solid rgba(64, 78, 104, .82);
      border-radius: 999px;
      background: rgba(10, 15, 24, .88);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .25);
      backdrop-filter: blur(18px);
    }
    .reading-paths strong { margin: 0 .2rem 0 .35rem; color: var(--muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
    .reading-paths a { padding: .38rem .72rem; border-radius: 999px; color: #dce7f7; background: #182235; font-size: .78rem; font-weight: 750; text-decoration: none; }
    .reading-paths a:hover { color: #071019; background: var(--accent); }
    .reading-paths span { margin-left: auto; padding-right: .35rem; color: var(--muted); font-size: .74rem; }
    h2 { margin: 4.6rem 0 1.8rem; padding: 0 0 1rem; border-bottom: 1px solid var(--line); font-size: clamp(1.85rem, 4vw, 3.05rem); }
    h2::before { content: "REPORT / "; display: block; margin-bottom: .55rem; color: var(--accent); font-size: .68rem; font-weight: 850; letter-spacing: .17em; }
    h3 { margin: 3rem 0 1rem; font-size: clamp(1.3rem, 2.5vw, 1.78rem); }
    h3::before { content: ""; display: inline-block; width: .5rem; height: .5rem; margin: 0 .65rem .16rem 0; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 .28rem var(--accent-soft); }
    h4 { margin-bottom: .4rem; }
    p { max-width: 76ch; }
    li + li { margin-top: .4rem; }
    a { color: var(--blue); text-decoration-color: rgba(102, 199, 255, .4); text-underline-offset: .2em; }
    a:hover { text-decoration-thickness: 2px; }
    blockquote { margin: 1.45rem 0; padding: 1.05rem 1.25rem; border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; background: var(--accent-soft); color: #f7e6b9; }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    th, td { min-width: 8rem; padding: .85rem .8rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--accent); background: #172134; font-size: .78rem; letter-spacing: .04em; }
    td { color: #c8d1df; font-size: .9rem; }
    code { color: #dce8f9; font-size: .88em; }
    img { display: block; max-width: 100%; height: auto; border-radius: 14px; }
    .layer-intro { margin: 1rem 0 2rem; padding: 1.15rem 1.25rem; border: 1px solid var(--line); border-radius: 14px; color: #bdc7d6; background: linear-gradient(135deg, #121b2b, #0f1622); }
    .layer-intro p { margin: 0; max-width: none; }
    .summary-dashboard { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .75rem; margin: 1.2rem 0 2rem; }
    .summary-dashboard article { min-height: 154px; padding: 1rem; border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 14px; background: linear-gradient(160deg, #172235, #101722); }
    .summary-dashboard span { color: var(--accent); font-size: .67rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .summary-dashboard strong { display: block; margin-top: .55rem; color: var(--ink); font-size: 1.03rem; line-height: 1.35; }
    .summary-dashboard p { margin: .5rem 0 0; color: var(--muted); font-size: .79rem; line-height: 1.5; }
    .market-board, .metric-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .7rem; margin: 1.1rem 0 2.2rem; }
    .market-board article, .metric-card { padding: 1rem; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    .market-board span, .metric-card span { display: block; color: var(--muted); font-size: .72rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .market-board strong, .metric-card strong { display: block; margin-top: .35rem; color: var(--ink); font-size: clamp(1.35rem, 2.8vw, 2rem); font-variant-numeric: tabular-nums; line-height: 1.1; }
    .market-board small { display: block; margin-top: .42rem; color: var(--muted); line-height: 1.35; }
    .market-board .up strong { color: var(--positive); }
    .market-board .down strong { color: var(--negative); }
    .story-visual, .logic-flow, .decision-chain { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; margin: 1rem 0 1.75rem; }
    .story-visual article, .logic-step, .decision-chain div { position: relative; min-height: 122px; padding: 1rem; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(145deg, #141e2e, #0f1621); }
    .story-visual span { color: var(--accent); font-size: .68rem; font-weight: 850; letter-spacing: .12em; }
    .story-visual strong, .logic-step strong, .decision-chain strong { display: block; margin: .45rem 0 .35rem; color: var(--ink); }
    .story-visual p, .logic-step, .decision-chain div { color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .story-visual p { margin: 0; }
    .story-visual article:not(:last-child)::after, .logic-step:not(:last-child)::after, .decision-chain div:not(:last-child)::after { content: "→"; position: absolute; top: 50%; right: -.67rem; z-index: 2; color: var(--accent); font-weight: 900; }
    .dual-thesis { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin: 1rem 0 1.8rem; }
    .dual-thesis article { padding: 1.15rem 1.2rem; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); }
    .dual-thesis article:first-child { border-top: 3px solid var(--negative); background: linear-gradient(145deg, var(--negative-soft), var(--panel)); }
    .dual-thesis article:last-child { border-top: 3px solid var(--positive); background: linear-gradient(145deg, var(--positive-soft), var(--panel)); }
    .dual-thesis span { color: var(--muted); font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .dual-thesis strong { display: block; margin: .45rem 0; font-size: 1.16rem; }
    .dual-thesis p { margin: 0; color: var(--muted); font-size: .87rem; }
    .topic-brief, .evidence-delta, .decision-brief { margin: .9rem 0 1.1rem; padding: 1.15rem 1.25rem; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); }
    .topic-brief { border-top: 3px solid var(--blue); background: linear-gradient(145deg, var(--blue-soft), var(--panel)); }
    .evidence-delta { border-top: 3px solid var(--accent); background: linear-gradient(145deg, var(--accent-soft), var(--panel)); }
    .decision-brief { border-top: 3px solid var(--positive); background: linear-gradient(145deg, var(--positive-soft), var(--panel)); }
    .topic-brief > :first-child, .evidence-delta > :first-child, .decision-brief > :first-child { margin-top: 0; }
    .topic-brief > :last-child, .evidence-delta > :last-child, .decision-brief > :last-child { margin-bottom: 0; }
    .speaker-opinion-marker { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .7rem; margin: 1.35rem 0 0; padding: .9rem 1.05rem .82rem; border: 1px solid #574a2d; border-bottom: 0; border-radius: 15px 15px 0 0; background: #1b1a18; color: #f8e8b9; }
    .speaker-opinion-marker::before { content: "◆"; color: var(--accent); }
    .speaker-opinion-kicker { padding: .2rem .55rem; border-radius: 999px; color: #101318; background: var(--accent); font-size: .67rem; font-weight: 900; letter-spacing: .08em; }
    .speaker-opinion-marker strong { color: var(--ink); font-size: 1.08rem; }
    .speaker-opinion-topic { color: #c8b989; font-size: .82rem; }
    .speaker-opinion-marker + blockquote { margin-top: 0; border: 1px solid #574a2d; border-left: 4px solid var(--accent); border-radius: 0 0 15px 15px; background: linear-gradient(145deg, #181a1c, #211f18); color: #f4e7c4; }
    details.report-detail, details.source-group { margin: .65rem 0 1.45rem; padding: .8rem 1rem; border: 1px solid #263145; border-radius: 12px; background: #0e1520; }
    details.report-detail summary, details.source-group summary { cursor: pointer; color: #9eabc0; font-size: .8rem; font-weight: 800; letter-spacing: .03em; }
    details.report-detail summary::after, details.source-group summary::after { content: "  ↘"; color: var(--accent); }
    details[open] summary { margin-bottom: .85rem; color: var(--accent); }
    .quick-news-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; margin: 1rem 0 1.7rem; }
    .quick-news-grid article, .quick-news-grid > ol > li { padding: 1rem; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    .quick-news-grid h3 { margin: 0 0 .35rem; font-size: 1rem; }
    .quick-news-grid h3::before { display: none; }
    .signal-grid, .data-grid, .assessment-grid, .judgment-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .8rem; margin: 1rem 0 1.7rem; }
    .signal-card, .data-card, .assessment-grid article, .judgment-overview article, .judgment-card { padding: 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    .signal-card.positive { border-top: 3px solid var(--positive); }
    .signal-card.caution { border-top: 3px solid var(--accent); }
    .signal-card.question { border-top: 3px solid var(--blue); }
    .status-row, .judgment-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin: .65rem 0; }
    .status-pill, .judgment-meta span, .status { display: inline-flex; padding: .22rem .58rem; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: .74rem; font-weight: 800; }
    .agent-disclaimer, .editorial-note { margin: 1rem 0 1.4rem; padding: 1rem 1.15rem; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; color: var(--muted); background: var(--panel); }
    .judgment-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
    .judgment-facts p { margin: 0; padding: .8rem; border: 1px solid var(--line); border-radius: 10px; background: #0f1723; }
    .video-data-grid, .company-takeaways, .assessment-depth { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .8rem; margin: 1rem 0 1.7rem; }
    .company-takeaways article, .assessment-depth article { padding: 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    .number-ribbon { display: flex; flex-wrap: wrap; gap: .55rem; margin: .9rem 0 1.4rem; }
    .number-ribbon span { padding: .42rem .68rem; border: 1px solid var(--line); border-radius: 999px; color: #cbd4e2; background: var(--panel); font-size: .8rem; font-variant-numeric: tabular-nums; }
    .reading-note, .chapter-lead, .coverage-note, .audit-links { margin: 1rem 0 1.5rem; padding: 1rem 1.15rem; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; color: #c4cedc; background: var(--panel); }
    .quote-pull { margin: 1.3rem 0 1.7rem; padding: 1.25rem 1.35rem; border-radius: 15px; color: #0b111b; background: var(--accent); font-size: 1.08rem; font-weight: 750; }
    .quote-pull p { margin: 0; max-width: none; }
    .judgment-card { margin: 1rem 0 1.4rem; }
    .judgment-rationale { margin: .75rem 0; padding: .8rem; border-left: 3px solid var(--blue); color: #c8d1df; background: var(--blue-soft); }
    .judgment-checklist { display: grid; grid-template-columns: 76px minmax(0, 1fr) 76px minmax(0, 1fr); gap: .5rem .6rem; margin: .8rem 0 0; font-size: .8rem; }
    .judgment-checklist dt { margin: 0; padding: .5rem .35rem; border-radius: 8px; color: var(--accent); background: var(--accent-soft); font-weight: 850; text-align: center; }
    .judgment-checklist dd { margin: 0; padding: .46rem .15rem; color: var(--muted); }
    .next-verification { margin-top: .75rem; padding-top: .7rem; border-top: 1px dashed var(--line); color: var(--muted); }
    .source-row, .annotation-target, .scope-label { color: var(--muted); font-size: .8rem; }
    nav.toc { margin: 1.5rem 0 2rem; padding: 1rem 1.2rem; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    @media (max-width: 780px) {
      body { font-size: 16px; }
      main { width: 100%; margin: 0 0 48px; }
      .report-cover { min-height: 620px; padding: 92px 22px 30px; border-width: 0 0 1px; border-radius: 0; }
      .cover-topline { top: 28px; left: 22px; right: 22px; align-items: flex-start; }
      .cover-topline span:last-child { max-width: 10rem; text-align: right; }
      h1 { font-size: clamp(2.55rem, 13vw, 4.1rem); }
      .cover-deck { font-size: 1.02rem; }
      .report-body { padding: 0 18px; }
      .reading-paths { top: 0; margin-right: -18px; margin-left: -18px; border-right: 0; border-left: 0; border-radius: 0 0 16px 16px; flex-wrap: nowrap; overflow-x: auto; }
      .reading-paths strong, .reading-paths a { flex: 0 0 auto; }
      .reading-paths span { display: none; }
      .summary-dashboard, .market-board, .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-dashboard article:first-child, .market-board article:first-child { grid-column: 1 / -1; }
      .story-visual, .logic-flow, .decision-chain, .dual-thesis, .quick-news-grid, .judgment-facts, .company-takeaways, .assessment-depth { grid-template-columns: 1fr; }
      .judgment-checklist { grid-template-columns: 66px minmax(0, 1fr); }
      .story-visual article, .logic-step, .decision-chain div { min-height: auto; }
      .story-visual article:not(:last-child)::after, .logic-step:not(:last-child)::after, .decision-chain div:not(:last-child)::after { content: "↓"; top: auto; right: 50%; bottom: -.92rem; }
      h2 { margin-top: 3.7rem; }
      table { max-width: 100%; }
    }
    @page { size: A4; margin: 14mm 13mm 16mm; }
    @media print {
      :root { color-scheme: light; --ink: #172033; --muted: #596579; --line: #d7dde7; --paper: #fff; --canvas: #fff; --panel: #f7f9fc; --panel-strong: #eef2f7; }
      html, body { background: #fff; }
      body { color: #172033; font-size: 10.5pt; line-height: 1.55; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      main { width: auto; max-width: none; margin: 0; }
      .report-cover { min-height: 240mm; border: 0; border-radius: 0; box-shadow: none; break-after: page; page-break-after: always; }
      .report-body { padding: 0; }
      .reading-paths { display: none; }
      h1 { font-size: 32pt; }
      h2 { margin-top: 10mm; font-size: 18pt; break-after: avoid-page; page-break-after: avoid; }
      h3 { font-size: 13pt; break-after: avoid-page; page-break-after: avoid; }
      p, li { orphans: 3; widows: 3; }
      table { display: table; overflow: visible; font-size: 8.5pt; }
      thead { display: table-header-group; }
      tr, blockquote, .summary-dashboard article, .market-board article, .story-visual article, .dual-thesis article, .speaker-opinion-marker, .speaker-opinion-marker + blockquote, .topic-brief, .evidence-delta, .decision-brief { break-inside: avoid-page; page-break-inside: avoid; }
      details.report-detail > :not(summary) { display: block !important; }
      details.report-detail summary { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="report-cover">
      <div class="cover-topline"><span>Market Intelligence</span><span>Deep Research Report</span></div>
      <p class="meta">{{REPORT_META}}</p>
      <h1>{{TITLE}}</h1>
      <p class="cover-deck">{{SUMMARY}}</p>
      <div class="cover-bottomline"><span>Content</span><span>Evidence</span><span>Decision</span></div>
    </header>
    <div class="report-body">
      {{REPORT_BODY}}
    </div>
  </main>
</body>
</html>
