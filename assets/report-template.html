<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #ece9e1;
      --paper: #fffdf8;
      --paper-strong: #ffffff;
      --ink: #20251f;
      --muted: #687067;
      --line: #d8d8ce;
      --line-strong: #b8bbae;
      --accent: #b6402d;
      --accent-soft: #f8e9e3;
      --blue: #315f70;
      --blue-soft: #e8f0f1;
      --positive: #3b7052;
      --positive-soft: #e9f2eb;
      --negative: #a33c34;
      --negative-soft: #f7e9e6;
      --gold: #8c691f;
      --gold-soft: #f5efdf;
      --shadow: 0 18px 46px rgba(45, 43, 35, .09);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--canvas); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font: 17px/1.78 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(1120px, calc(100% - 40px)); margin: 20px auto 64px; }
    .report-cover {
      position: relative;
      overflow: hidden;
      min-height: 0;
      padding: clamp(34px, 5vw, 58px) clamp(28px, 6vw, 68px) 36px;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .report-cover::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: linear-gradient(90deg, var(--accent) 0 22%, var(--blue) 22% 52%, #c5a455 52% 100%);
    }
    .cover-topline, .cover-bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--accent);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .cover-topline { margin-bottom: clamp(42px, 7vw, 76px); }
    .cover-topline span:last-child { color: var(--muted); }
    .meta { margin: 0 0 .8rem; color: var(--muted); font-size: .8rem; letter-spacing: .035em; }
    h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -.025em; text-wrap: balance; }
    h1 { max-width: 18em; margin: 0; font-size: clamp(2.25rem, 4.2vw, 3.25rem); font-weight: 760; }
    .cover-deck { max-width: 42em; margin: 1.1rem 0 1.6rem; color: #4d554d; font-size: clamp(1rem, 1.6vw, 1.16rem); line-height: 1.7; }
    .cover-bottomline { justify-content: flex-start; flex-wrap: wrap; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); }
    .cover-bottomline span { display: inline-flex; align-items: center; gap: .45rem; }
    .cover-bottomline span::before { content: ""; width: .34rem; height: .34rem; border-radius: 50%; background: var(--accent); }
    .report-body { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
    .reading-paths {
      position: sticky;
      top: 10px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem;
      margin: 14px 0 42px;
      padding: .62rem .75rem;
      border: 1px solid rgba(184, 187, 174, .92);
      border-radius: 12px;
      background: rgba(255, 253, 248, .94);
      box-shadow: 0 8px 24px rgba(45, 43, 35, .08);
      backdrop-filter: blur(14px);
    }
    .reading-paths strong { margin-right: .1rem; color: var(--muted); font-size: .72rem; letter-spacing: .09em; }
    .reading-paths a { padding: .3rem .62rem; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: .78rem; font-weight: 760; text-decoration: none; }
    .reading-paths a:hover { color: #fff; background: var(--blue); }
    .reading-paths span { margin-left: auto; color: var(--muted); font-size: .75rem; }
    h2 { margin: 4.4rem 0 1.5rem; padding-bottom: .8rem; border-bottom: 1px solid var(--line-strong); font-size: clamp(1.75rem, 3vw, 2.35rem); }
    h2::before { content: "EDITORIAL BRIEF"; display: block; margin-bottom: .45rem; color: var(--accent); font-size: .65rem; font-weight: 850; letter-spacing: .15em; }
    h3 { max-width: 30em; margin: 2.8rem 0 .9rem; font-size: clamp(1.3rem, 2.1vw, 1.62rem); }
    h3::before { content: ""; display: inline-block; width: 1.5rem; height: 3px; margin: 0 .65rem .28rem 0; background: var(--accent); }
    h4 { margin: 0 0 .42rem; font-size: 1rem; }
    p, .video-section > ul, .video-section > ol { max-width: 42em; }
    p { margin: .75rem 0; }
    li + li { margin-top: .38rem; }
    a { color: var(--blue); text-decoration-color: #9fb7bf; text-underline-offset: .2em; }
    a:hover { text-decoration-thickness: 2px; }
    blockquote { max-width: 42em; margin: 1.2rem 0; padding: .85rem 1rem; border-left: 3px solid var(--accent); background: var(--accent-soft); color: #5f3029; }
    code { font-size: .88em; }
    img { display: block; max-width: 100%; height: auto; border-radius: 12px; }
    img[src$=".svg"] { width: 100%; margin: 1rem 0 .35rem; border: 1px solid var(--line); background: #fff; }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-strong); }
    th, td { min-width: 8rem; padding: .75rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--blue); background: var(--blue-soft); font-size: .78rem; }
    td { color: #4d554d; font-size: .9rem; }
    .layer-intro, .section-lead, .chapter-lead, .reading-note, .plain-language-note, .editorial-note, .agent-disclaimer, .coverage-note, .audit-links {
      max-width: 42em;
      margin: 1rem 0 1.8rem;
      padding: .95rem 1.1rem;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      color: #4d554d;
      background: #faf7ef;
    }
    .section-lead { margin: .7rem 0 1.35rem; color: #30372f; font-size: 1.04rem; font-weight: 650; }
    .video-section { scroll-margin-top: 78px; }
    .video-section + .video-section { margin-top: 4.2rem; padding-top: .45rem; border-top: 1px solid var(--line); }
    .summary-dashboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; margin: 1.2rem 0 2.5rem; }
    .summary-dashboard article { min-height: 132px; padding: 1rem 1.05rem; border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 12px; background: var(--paper-strong); box-shadow: 0 8px 20px rgba(45, 43, 35, .045); }
    .summary-dashboard article:first-child { background: #faf4ee; }
    .summary-dashboard span { color: var(--accent); font-size: .68rem; font-weight: 850; letter-spacing: .08em; }
    .summary-dashboard strong { display: block; margin-top: .45rem; font-size: 1.02rem; line-height: 1.42; }
    .summary-dashboard p { margin: .42rem 0 0; color: var(--muted); font-size: .8rem; line-height: 1.55; }
    .metric-grid, .market-board, .video-data-grid, .signal-grid, .data-grid, .company-takeaways, .assessment-grid, .judgment-overview, .assessment-depth, .scenario-grid, .evidence-status-grid, .investor-dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .75rem;
      margin: 1rem 0 1.7rem;
    }
    .metric-card, .market-board article, .data-card, .signal-card, .company-takeaways article, .assessment, .assessment-grid article, .judgment-overview article, .judgment-card, .assessment-depth article, .scenario-grid article, .evidence-status-grid article, .investor-topic {
      padding: .95rem 1rem;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--paper-strong);
    }
    .metric-card span, .market-board span, .data-card span { display: block; color: var(--muted); font-size: .72rem; font-weight: 740; letter-spacing: .05em; }
    .metric-card strong, .market-board strong, .data-card strong { display: block; margin-top: .3rem; color: var(--blue); font-size: clamp(1.35rem, 2.4vw, 1.8rem); font-variant-numeric: tabular-nums; line-height: 1.15; }
    .metric-card small, .market-board small { display: block; margin-top: .4rem; color: var(--muted); line-height: 1.45; }
    .market-board .up strong, .signal-card.positive strong { color: var(--positive); }
    .market-board .down strong { color: var(--negative); }
    .story-visual, .logic-flow, .decision-chain, .comparison-grid, .relationship-map {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .75rem;
      margin: 1rem 0 1.7rem;
    }
    .story-visual article, .logic-step, .decision-chain div, .comparison-grid article, .relationship-map article {
      position: relative;
      min-height: 104px;
      padding: .95rem 1rem;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #f8f8f3;
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.55;
    }
    .story-visual span, .comparison-grid span, .relationship-map span { color: var(--accent); font-size: .68rem; font-weight: 820; letter-spacing: .07em; }
    .story-visual strong, .logic-step strong, .decision-chain strong, .comparison-grid strong, .relationship-map strong { display: block; margin: .35rem 0; color: var(--ink); }
    .logic-step:not(:last-child)::after, .decision-chain div:not(:last-child)::after { content: "→"; position: absolute; top: 42%; right: -.67rem; z-index: 2; color: var(--accent); font-weight: 900; }
    .event-timeline, .catalyst-calendar { margin: 1rem 0 1.7rem; padding: 0; list-style: none; border-top: 1px solid var(--line-strong); }
    .event-timeline li, .catalyst-calendar li { display: grid; grid-template-columns: minmax(92px, 130px) minmax(0, 1fr); gap: 1rem; margin: 0; padding: .82rem .2rem; border-bottom: 1px solid var(--line); }
    .event-timeline time, .catalyst-calendar time { color: var(--accent); font-size: .78rem; font-weight: 760; }
    .quick-news-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin: 1rem 0 1.7rem; }
    .quick-news-grid article, .quick-news-grid > ol > li { padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 11px; background: var(--paper-strong); }
    .quick-news-grid h3 { margin: 0 0 .3rem; font-size: 1rem; }
    .quick-news-grid h3::before { display: none; }
    .speaker-opinion-marker { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .7rem; max-width: 42em; margin: 1.3rem 0 0; padding: .78rem .92rem; border: 1px solid #d6b7ad; border-bottom: 0; border-radius: 11px 11px 0 0; background: #fbf1ed; }
    .speaker-opinion-marker::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--accent); }
    .speaker-opinion-kicker { padding: .17rem .48rem; border-radius: 999px; color: #fff; background: var(--accent); font-size: .65rem; font-weight: 850; letter-spacing: .06em; }
    .speaker-opinion-marker strong { font-size: 1rem; }
    .speaker-opinion-topic { color: var(--muted); font-size: .8rem; }
    .creator-view-card::after, .reported-view-card::after { margin-left: auto; color: var(--muted); font-size: .65rem; font-weight: 760; letter-spacing: .05em; }
    .creator-view-card::after { content: "讲者本人观点"; }
    .reported-view-card { border-color: #b7ccd2; background: #edf5f6; }
    .reported-view-card::before { background: var(--blue); }
    .reported-view-card::after { content: "视频内转述观点"; }
    .reported-view-card .speaker-opinion-kicker { background: var(--blue); }
    .view-summary, .speaker-opinion-marker + blockquote { max-width: 42em; margin: 0 0 1.35rem; padding: .88rem 1rem; border: 1px solid #d6b7ad; border-left: 3px solid var(--accent); border-radius: 0 0 11px 11px; background: var(--paper-strong); color: #413d38; }
    .reported-view-card + .view-summary, .reported-view-card + blockquote { border-color: #b7ccd2; border-left-color: var(--blue); }
    .view-summary::before { content: "观点摘要"; display: block; margin-bottom: .3rem; color: var(--muted); font-size: .65rem; font-weight: 820; letter-spacing: .08em; }
    .view-summary p { margin: .3rem 0; }
    .dual-thesis { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin: 1rem 0 1.7rem; }
    .dual-thesis article { padding: 1rem; border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 11px; background: var(--paper-strong); }
    .dual-thesis article:last-child { border-top-color: var(--positive); }
    .topic-brief, .evidence-delta, .decision-brief { margin: .9rem 0 1.1rem; padding: 1rem 1.05rem; border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 0 11px 11px 0; background: var(--paper-strong); }
    .evidence-delta { border-left-color: var(--gold); background: var(--gold-soft); }
    .decision-brief { border-left-color: var(--positive); background: var(--positive-soft); }
    .investor-dashboard { margin: 1rem 0 2.4rem; padding: 1.15rem; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--paper-strong); }
    .investor-dashboard-header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: .5rem; padding-bottom: .8rem; border-bottom: 1px solid var(--line); }
    .dashboard-kicker, .asset-tags { color: var(--accent); font-size: .68rem; font-weight: 850; letter-spacing: .08em; }
    .asset-map, .number-ribbon, .status-row, .judgment-meta { display: flex; flex-wrap: wrap; gap: .45rem; margin: .8rem 0 1.3rem; }
    .asset-map span, .number-ribbon span, .status-pill, .judgment-meta span, .status { padding: .22rem .55rem; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: .75rem; font-weight: 730; }
    details.report-detail, details.source-group { max-width: 48em; margin: .65rem 0 1.35rem; padding: .72rem .9rem; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-strong); }
    details summary { cursor: pointer; color: var(--muted); font-size: .8rem; font-weight: 760; }
    details[open] summary { margin-bottom: .7rem; color: var(--accent); }
    .visual-caption, .source-row, .annotation-target, .scope-label, .next-verification { color: var(--muted); font-size: .8rem; }
    .signal-card.positive { border-top: 3px solid var(--positive); }
    .signal-card.caution { border-top: 3px solid var(--gold); }
    .signal-card.question { border-top: 3px solid var(--blue); }

    @media screen and (max-width: 780px) {
      body { font-size: 16px; line-height: 1.76; }
      main { width: 100%; margin: 0 0 44px; }
      .report-cover { padding: 28px 20px 24px; border-width: 0 0 1px; border-radius: 0; box-shadow: none; }
      .cover-topline { margin-bottom: 42px; }
      h1 { max-width: none; font-size: clamp(2rem, 9vw, 2.25rem); }
      .cover-deck { font-size: 1rem; }
      .report-body { padding: 0 16px; }
      .reading-paths { top: 0; margin: 0 -16px 34px; padding: .58rem 16px; border-right: 0; border-left: 0; border-radius: 0 0 10px 10px; }
      .reading-paths span { width: 100%; margin-left: 0; }
      h2 { margin-top: 3.4rem; font-size: 1.75rem; }
      h3 { margin-top: 2.35rem; font-size: 1.34rem; }
      .summary-dashboard, .metric-grid, .market-board, .video-data-grid, .signal-grid, .data-grid, .company-takeaways, .assessment-grid, .judgment-overview, .assessment-depth, .scenario-grid, .evidence-status-grid, .investor-dashboard-grid, .story-visual, .logic-flow, .decision-chain, .comparison-grid, .relationship-map, .dual-thesis, .quick-news-grid { grid-template-columns: 1fr; }
      .logic-step, .decision-chain div { min-height: auto; }
      .logic-step:not(:last-child)::after, .decision-chain div:not(:last-child)::after { content: "↓"; top: auto; right: 50%; bottom: -.82rem; }
      .event-timeline li, .catalyst-calendar li { grid-template-columns: 1fr; gap: .2rem; }
      .creator-view-card::after, .reported-view-card::after { width: 100%; margin-left: 1.65rem; }
      table { font-size: .88rem; }
    }

    @media print {
      @page { size: A4; margin: 15mm 14mm 17mm; }
      :root { color-scheme: light; }
      html, body { background: #fff !important; }
      body { color: #20251f; font-size: 10pt; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      main { width: auto; margin: 0; }
      .report-cover { padding: 12mm; border-radius: 0; box-shadow: none; }
      .cover-topline { margin-bottom: 18mm; }
      h1 { font-size: 25pt; }
      h2 { margin-top: 10mm; font-size: 17pt; break-after: avoid-page; }
      h3 { font-size: 13pt; break-after: avoid-page; }
      .report-body { max-width: none; padding: 0; }
      .reading-paths { display: none; }
      p, li { orphans: 3; widows: 3; }
      table { display: table; overflow: visible; }
      tr, blockquote, article, .section-lead, .speaker-opinion-marker, .view-summary, .logic-step { break-inside: avoid-page; }
      details.report-detail > :not(summary) { display: block !important; }
      details.report-detail summary { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="report-cover">
      <div class="cover-topline"><span>Editorial Research Brief</span><span>{{REPORT_EDITION}}</span></div>
      <p class="meta">{{REPORT_META}}</p>
      <h1>{{TITLE}}</h1>
      <p class="cover-deck">{{SUMMARY}}</p>
      <div class="cover-bottomline">{{REPORT_SCOPE}}</div>
    </header>
    <div class="report-body">
      {{REPORT_BODY}}
    </div>
  </main>
</body>
</html>
