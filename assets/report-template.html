<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #152033;
      --muted: #667085;
      --line: #e3e8ef;
      --paper: #ffffff;
      --canvas: #f2f5f9;
      --note: #f7f9fc;
      --accent: #3157d5;
      --accent-soft: #eef3ff;
      --warm: #a45f0a;
      --warm-soft: #fff7e8;
      --positive: #19734b;
      --positive-soft: #eaf8f1;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font: 17px/1.68 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
    }
    main {
      width: min(1120px, calc(100% - 40px));
      margin: 28px auto 56px;
      padding: clamp(28px, 5vw, 68px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 20px 54px rgba(16, 24, 40, .08);
    }
    header { margin-bottom: 2rem; }
    h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -.02em; text-wrap: balance; }
    h1 { max-width: 18em; margin: .15em 0 .35em; font-size: clamp(2rem, 5vw, 3.55rem); }
    h2 { margin-top: 2.35em; padding-bottom: .4em; border-bottom: 1px solid var(--line); font-size: clamp(1.55rem, 3vw, 2.15rem); }
    h3 { margin-top: 1.65em; font-size: 1.28rem; }
    h4 { margin-bottom: .4em; }
    p { max-width: 74ch; }
    li + li { margin-top: .35rem; }
    a { color: var(--accent); text-underline-offset: .18em; }
    a:hover { text-decoration-thickness: 2px; }
    .meta { color: var(--muted); }
    header > p:last-child { max-width: 72ch; color: #475467; font-size: 1.08rem; }
    blockquote {
      margin: 1.5em 0;
      padding: 1em 1.25em;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      color: #263a72;
    }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { min-width: 8rem; padding: .75rem .7rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: #344054; background: #f8fafc; font-size: .86rem; }
    code { font-size: .88em; }
    img { display: block; max-width: 100%; height: auto; border-radius: 14px; }
    img[src$=".svg"] { width: 100%; margin: 1rem 0 .35rem; border: 1px solid var(--line); background: #fff; box-shadow: 0 12px 30px rgba(16, 24, 40, .06); }
    .visual-caption { margin: .35rem 0 1.4rem; color: var(--muted); font-size: .86rem; }
    .layer-intro { margin: 1rem 0 1.6rem; padding: 1rem 1.15rem; border-radius: 12px; color: #344054; background: #f4f7fb; }
    .layer-intro.creator { border-left: 5px solid var(--accent); }
    .layer-intro.external { border-left: 5px solid #d8a33a; }
    .summary-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: .65rem; margin: 1rem 0 1.5rem; }
    .summary-dashboard article { min-height: 112px; padding: .85rem .9rem; border: 1px solid var(--line); border-top: 4px solid #6b83df; border-radius: 13px; background: #fbfcfe; }
    .summary-dashboard span { color: var(--muted); font-size: .76rem; font-weight: 750; }
    .summary-dashboard strong { display: block; margin-top: .28rem; color: #1f3a8a; font-size: .98rem; }
    .summary-dashboard p { margin: .28rem 0 0; color: #475467; font-size: .8rem; line-height: 1.45; }
    .signal-grid, .data-grid, .assessment-grid, .judgment-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .75rem; margin: 1rem 0 1.5rem; }
    .signal-card, .data-card, .assessment-grid article, .judgment-overview article { padding: 1rem; border: 1px solid var(--line); border-radius: 13px; background: #fbfcfe; }
    .signal-card h4, .assessment-grid h3, .judgment-overview h3 { margin: 0 0 .35rem; font-size: 1rem; }
    .signal-card p, .assessment-grid p, .judgment-overview p { margin: .32rem 0; font-size: .88rem; line-height: 1.55; }
    .signal-card.positive { border-top: 4px solid #55a47f; }
    .signal-card.caution { border-top: 4px solid #d8a33a; }
    .signal-card.question { border-top: 4px solid #8291ad; }
    .data-card { border-top: 3px solid #9db0ef; border-radius: 4px; background: #f8faff; }
    .data-card strong { display: block; color: #1f3a8a; font-size: 1.18rem; font-variant-numeric: tabular-nums; }
    .data-card span { display: block; margin-top: .2rem; color: var(--muted); font-size: .82rem; }
    .quick-news-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin: 1rem 0 1.4rem; }
    .quick-news-grid article { padding: .95rem 1rem; border: 1px solid var(--line); border-radius: 12px; background: #fbfcfd; }
    .quick-news-grid h3 { margin: 0 0 .35rem; font-size: 1rem; }
    .quick-news-grid p { margin: .3rem 0; font-size: .88rem; }
    .speaker-opinion-marker { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .65rem; margin: 1.15rem 0 0; padding: .8rem 1rem .72rem; border: 1px solid #e7b85e; border-bottom: 0; border-radius: 14px 14px 0 0; background: #fff4d8; color: #6f3b00; box-shadow: 0 9px 24px rgba(146, 85, 10, .08); }
    .speaker-opinion-marker::before { content: "◆"; color: #c66a08; font-size: .8rem; }
    .speaker-opinion-kicker { padding: .18rem .5rem; border-radius: 999px; background: #b45309; color: #fff; font-size: .72rem; font-weight: 800; }
    .speaker-opinion-marker strong { color: #7a3e00; font-size: 1.08rem; }
    .speaker-opinion-topic { color: #8a5a20; font-size: .82rem; }
    .speaker-opinion-marker + blockquote { margin-top: 0; padding: 1rem 1.2rem 1.08rem; border: 1px solid #e7b85e; border-left: 5px solid #d97706; border-radius: 0 0 14px 14px; color: #3f2a12; background: linear-gradient(145deg, #fffdf8, #fff8e8); box-shadow: 0 12px 28px rgba(146, 85, 10, .08); }
    .editorial-note { margin: .75rem 0 1.2rem; padding: .8rem 1rem; border: 1px dashed #98a2b3; border-left: 4px solid #667085; border-radius: 10px; background: #f8fafc; color: #475467; font-size: .86rem; }
    .scope-label { color: #7a4b08; font-size: .78rem !important; }
    .source-row, .annotation-target { color: var(--muted); font-size: .8rem !important; }
    .status-row, .judgment-meta { display: flex; flex-wrap: wrap; gap: .35rem; margin: .6rem 0; }
    .status-pill, .judgment-meta span { display: inline-flex; padding: .2rem .55rem; border-radius: 999px; background: #e9efff; color: #3157d5; font-size: .76rem; font-weight: 750; }
    .status-pill.warn, .judgment-meta span.caution { color: #b54708; background: #fff3e8; }
    .status-pill.neutral { color: #475467; background: #f2f4f7; }
    .agent-disclaimer { margin: 1rem 0 1.3rem; padding: 1rem 1.15rem; border: 1px solid #b7c6f8; border-left: 5px solid var(--accent); border-radius: 12px; background: #f5f7ff; color: #263a72; }
    .judgment-card { margin: 1rem 0 1.35rem; padding: 1rem 1.1rem; border: 1px solid #cdd6f7; border-radius: 15px; background: linear-gradient(145deg, #fff, #f7f9ff); }
    .judgment-card h3 { margin: 0 0 .55rem; font-size: 1.08rem; }
    .judgment-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; margin: .65rem 0; }
    .judgment-facts p { margin: 0; padding: .72rem .78rem; border: 1px solid #e2e7f2; border-radius: 10px; background: #fff; font-size: .84rem; line-height: 1.55; }
    .judgment-rationale { margin: .7rem 0; padding: .72rem .8rem; border-left: 3px solid #8296df; background: #f7f9ff; color: #344054; font-size: .84rem; line-height: 1.58; }
    .judgment-checklist { display: grid; grid-template-columns: 68px minmax(0, 1fr) 68px minmax(0, 1fr); gap: .45rem .55rem; margin: .7rem 0 0; font-size: .8rem; }
    .judgment-checklist dt { margin: 0; padding: .5rem .35rem; border-radius: 8px; background: #e9efff; color: #2344a1; font-weight: 800; text-align: center; }
    .judgment-checklist dd { margin: 0; padding: .48rem .15rem; color: #475467; line-height: 1.45; }
    .next-verification { margin: .72rem 0 0; padding-top: .65rem; border-top: 1px dashed #cdd5e7; color: #344054; font-size: .82rem; }
    .decision-chain { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .55rem; margin: .85rem 0 1.3rem; }
    .decision-chain div { position: relative; padding: .75rem; border: 1px solid #dfe5f4; border-radius: 10px; background: #fff; font-size: .82rem; }
    .decision-chain strong { display: block; margin-bottom: .25rem; color: #344054; }
    .decision-chain div:not(:last-child)::after { content: "→"; position: absolute; top: 50%; right: -.48rem; z-index: 2; color: #667085; font-weight: 800; }
    details.source-group { margin: .75rem 0; padding: .8rem 1rem; border: 1px solid var(--line); border-radius: 11px; background: #fcfcfd; }
    details.source-group summary { cursor: pointer; color: #344054; font-weight: 700; }
    details.source-group[open] summary { margin-bottom: .65rem; }
    @media (max-width: 640px) {
      body { font-size: 16px; }
      main { width: 100%; margin: 0; padding: 22px 18px 48px; border: 0; border-radius: 0; box-shadow: none; }
      .quick-news-grid, .judgment-facts, .decision-chain { grid-template-columns: 1fr; }
      .judgment-checklist { grid-template-columns: 62px minmax(0, 1fr); }
      .decision-chain div:not(:last-child)::after { content: "↓"; top: auto; right: 50%; bottom: -.8rem; }
      p:has(> img[src$=".svg"]) { max-width: 100%; overflow-x: auto; padding-bottom: .35rem; }
      p > img[src$=".svg"] { width: 760px; max-width: none; }
    }
    @page { size: A4; margin: 14mm 13mm 16mm; }
    @media print {
      html, body { background: #fff; }
      body { font-size: 10.5pt; line-height: 1.55; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      main { width: auto; max-width: none; margin: 0; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
      h2, h3 { break-after: avoid-page; page-break-after: avoid; }
      p, li { orphans: 3; widows: 3; }
      img[src$=".svg"] { border: .3pt solid #d0d5dd; box-shadow: none; }
      .judgment-card, .speaker-opinion-marker, .speaker-opinion-marker + blockquote { break-inside: avoid-page; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="meta">{{REPORT_META}}</p>
      <h1>{{TITLE}}</h1>
      <p>{{SUMMARY}}</p>
    </header>
    {{REPORT_BODY}}
  </main>
</body>
</html>
