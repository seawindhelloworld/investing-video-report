[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subtitle-opinion-report"
version = "0.1.0"
description = "Build traceable opinion reports from validated timestamped transcript packages."
requires-python = ">=3.10"
dependencies = [
  "Markdown>=3.8,<4",
]

[project.scripts]
video-opinion-report = "video_opinion_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
